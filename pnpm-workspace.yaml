# nodeLinker: hoisted, required by electron-forge so it can crawl a flat
# node_modules tree when packaging.
nodeLinker: hoisted
# Allowance for the @electron/node-gyp transitive dep (git+https URL,
# pinned SHA) pulled in by @electron/rebuild.
blockExoticSubdeps: false
# Supply-chain hardening, pinned in-repo so it holds for every clone:
# delay installs of newly published versions by 7 days (minutes), and
# refuse updates whose trust signals weaken.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
# electron-forge's older dependency tree predates provenance, so versions
# public for a year or more skip the downgrade check.
trustPolicyIgnoreAfter: 525600
# Per-package build-script trust (ignore-scripts stays on otherwise).
allowBuilds:
  electron: true
  esbuild: true
overrides:
  "tar@<7.5.10": "^7.5.10"
  "tmp@<0.2.7": "0.2.7"
