[package]
name = "samplary-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
rustfft = "6.4"
symphonia = { version = "0.6.1", features = ["all"] }
rayon = "1.11"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
walkdir = "2.5"
notify = "=8.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tract-onnx = { version = "=0.23.9", default-features = false }
